name: Machine Learning Workflow CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-ml-project:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.12.7'

    - name: Install MLflow and Dependencies
      shell: bash -l {0}
      run: |
        pip install mlflow==2.19.0 pandas numpy scikit-learn

    - name: Run MLflow Project
      shell: bash -l {0}
      run: |
        mlflow run . --env-manager local

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # PERBAIKAN MUTLAK: Memaksa MLflow build Docker menggunakan Python 3.12 agar lolos dari eror pip 3.9
    - name: Build and Push Docker Image
      shell: bash -l {0}
      run: |
        export MLFLOW_TRACKING_URI="file:///home/runner/work/Workflow-CI/Workflow-CI/mlruns"
        RUN_ID=$(ls -t mlruns/0/ | grep -v "meta.yaml" | head -n 1)
        mlflow models build-docker -m "runs:/$RUN_ID/random_forest_model" -n "${{ secrets.DOCKERHUB_USERNAME }}/telco-churn-model:latest" --python-version 3.12
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/telco-churn-model:latest
