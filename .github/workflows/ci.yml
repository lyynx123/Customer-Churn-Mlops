name: Machine Learning Workflow CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-ml-project:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.12.7'

    - name: Install MLflow and Dependencies
      shell: bash -l {0}
      run: |
        pip install mlflow==2.19.0 pandas numpy scikit-learn

    - name: Run MLflow Project
      shell: bash -l {0}
      run: |
        mlflow run . --env-manager local

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # PERBAIKAN REVOLUSIONER: Menggunakan Docker Build murni untuk menghindari bug internal MLflow CLI
    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/telco-churn-model:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/telco-churn-model:latest
