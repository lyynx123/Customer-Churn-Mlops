name: Machine Learning Workflow CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-ml-project:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Miniconda
      uses: conda-incubator/setup-mediconda@v3
      with:
        auto-update-conda: true
        python-version: '3.12.7'

    - name: Install MLflow and Dependencies
      shell: bash -l {0}
      run: |
        pip install mlflow==2.19.0 pandas numpy scikit-learn dagshub

    # PERBAIKAN: Menyuntikkan kredensial token DagsHub langsung ke env server agar tidak meminta otorisasi browser
    - name: Run MLflow Project
      shell: bash -l {0}
      env:
        MLFLOW_TRACKING_URI: "https://dagshub.com/lyynx123/Eksperimen_SML_Ahmad.mlflow"
        MLFLOW_TRACKING_USERNAME: "lyynx123"
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }} 
      run: |
        mlflow run . --env-manager local

    - name: Upload Pipeline Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-artifacts
        path: mlruns/

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/telco-churn-model:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/telco-churn-model:latest
